name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the Dependabot follow-up starts it on main after a merge

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ShellCheck (pinned; Dependabot bumps it)
        run: pip install --user "$(grep '^shellcheck-py==' .github/lint/requirements.txt)"

      # The checks themselves live in the Makefile (one copy for CI and people).
      - name: ShellCheck (the pinned one, not the runner's)
        run: make lint-shell SHELLCHECK=~/.local/bin/shellcheck

      - name: Env template passes install.sh --check once filled in, and is rejected as it is
        run: make lint-env

      - name: Links and anchors in the docs
        run: make lint-docs

  config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install linters (pinned; Dependabot bumps them)
        run: pip install --user -r .github/lint/requirements.txt

      - name: yamllint, ansible-lint, playbook syntax
        run: make lint-yaml lint-ansible

  home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      # The Nix store (nixpkgs source, the home configuration's closure), keyed on
      # the lock: a new cache only when an input changes. Runs after Nix is installed.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('config/home/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      - name: Flake check (builds the home configuration) and nixfmt
        run: make lint-nix
