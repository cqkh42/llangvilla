name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ShellCheck (pinned; Dependabot bumps it)
        run: pip install --user "$(grep '^shellcheck-py==' .github/lint/requirements.txt)"

      - name: ShellCheck
        run: ~/.local/bin/shellcheck installer/*.sh config/*.sh vm/*.sh .github/scripts/*.sh   # the pinned one, not the runner's

      - name: Env template parses as bash
        run: bash -n installer/autoinstall.env.example

      - name: Env template passes install.sh --check once filled in
        run: |
          hash=$(openssl passwd -6 ci-test)
          tmpl=installer/autoinstall.env.example
          sed -e 's|__WIFI_SSID__|CI|' \
              -e 's|__WIFI_PASSWORD__|ci-password|' \
              -e "s|__PASSWORD_HASH__|${hash}|" "$tmpl" > /tmp/ci.env
          bash installer/install.sh --check /tmp/ci.env
          # and the raw template must be rejected (placeholders left)
          ! bash installer/install.sh --check "$tmpl"

  config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install linters (pinned; Dependabot bumps them)
        run: pip install --user -r .github/lint/requirements.txt

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint config/ansible

      - name: Playbook syntax
        working-directory: config/ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: ansible-playbook --syntax-check site.yml

  home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      # The Nix store (nixpkgs source, the home configuration's closure), keyed on
      # the lock: a new cache only when an input changes. Runs after Nix is installed.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('config/home/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      - name: Flake check
        run: nix flake check ./config/home

      - name: Formatting (nixfmt)
        run: git ls-files -z 'config/home/*.nix' | xargs -0 nix run ./config/home#formatter.x86_64-linux -- --check

      - name: Build the home configuration
        run: nix build ./config/home#homeConfigurations.jack.activationPackage --no-link
