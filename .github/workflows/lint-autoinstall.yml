name: Lint autoinstall scripts

on:
  push:
    branches: [main]
    paths:
      - 'autoinstall/**'
      - '.github/workflows/lint-autoinstall.yml'
  pull_request:
    paths:
      - 'autoinstall/**'
      - '.github/workflows/lint-autoinstall.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck autoinstall/*.sh

      - name: Env template parses as bash
        run: bash -n autoinstall/autoinstall.env.example

      - name: Env template passes install.sh --check once filled in
        run: |
          hash=$(openssl passwd -6 ci-test)
          tmpl=autoinstall/autoinstall.env.example
          sed -e 's|__WIFI_SSID__|CI|' \
              -e 's|__WIFI_PASSWORD__|ci-password|' \
              -e "s|__PASSWORD_HASH__|${hash}|" "$tmpl" > /tmp/ci.env
          bash autoinstall/install.sh --check /tmp/ci.env
          # and the raw template must be rejected (placeholders left)
          ! bash autoinstall/install.sh --check "$tmpl"
