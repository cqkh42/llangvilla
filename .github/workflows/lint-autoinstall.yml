name: Lint autoinstall scripts

on:
  push:
    branches: [main]
    paths:
      - 'autoinstall/**'
      - '.github/workflows/lint-autoinstall.yml'
  pull_request:
    paths:
      - 'autoinstall/**'
      - '.github/workflows/lint-autoinstall.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck autoinstall/*.sh

      - name: Env template parses as bash
        run: bash -n autoinstall/autoinstall.env.example
