name: VM install test

# Full end-to-end test of the working tree: build the ISO, install Arch into a
# QEMU VM from a test stick, check the base system, then apply config/ and check
# again (vm/test-vm.sh all).
# Takes roughly 40-60 minutes. Run it on demand from the Actions tab.
# Manual only for now; the weekly schedule comes back once it passes reliably
# (cqkh42/llangvilla#11).
on:
  workflow_dispatch:
    inputs:
      firstboot:
        description: "Also run the real first-boot hook (clones the default branch from GitHub)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: >-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          rule+=', OPTIONS+="static_node=kvm"'
          echo "$rule" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf \
            mtools dosfstools openssh-client

      - name: Build the ISO
        run: autoinstall/build-usb.sh

      - name: Install, check and apply the config in a VM
        env:
          FIRSTBOOT_FLAG: ${{ inputs.firstboot && '--firstboot' || '' }}
        run: |
          # shellcheck disable=SC2086  # empty or one flag
          vm/test-vm.sh all --timeout 75 $FIRSTBOOT_FLAG

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: ~/.cache/llangvilla/vm/logs/
          if-no-files-found: ignore
