name: VM install test

# Full end-to-end test of the working tree: build the ISO, install Arch into a
# QEMU VM from a test stick, check the base system, then apply config/ and check
# again (vm/test-vm.sh all).
# Takes about 20 minutes. Runs on every pull request that changes what the machine
# runs (including Dependabot's flake.lock bumps), weekly because Arch is a rolling
# release and can break the installer without any commit here, and on demand from
# the Actions tab.
on:
  pull_request:
    paths:
      - installer/**
      - config/**
      - vm/**
      - .github/workflows/vm-test.yml
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"   # Mondays 03:23 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-install:
    runs-on: ubuntu-24.04
    # Each step has its own limit (install 30 min, first boot 25, every SSH command 5
    # unless set longer), so a hang fails in minutes; this only backs them up.
    timeout-minutes: 75
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Free disk space
        run: >-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          rule+=', OPTIONS+="static_node=kvm"'
          echo "$rule" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf \
            mtools dosfstools openssh-client

      - name: Build the ISO
        run: installer/build-usb.sh

      # The installed system's first boot runs the real hook against a snapshot of
      # this checkout, then the config phase re-applies it and checks the result.
      - name: Install, check and apply the config in a VM
        run: vm/test-vm.sh all --timeout 30

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: ~/.cache/llangvilla/vm/logs/
          if-no-files-found: ignore
