name: VM install test

# Full end-to-end test: build the ISO, install Arch into a QEMU VM from a test
# stick, boot the result and run the checks in autoinstall/test-vm.sh.
# Takes roughly 30-45 minutes. Runs weekly (Arch is a rolling release, so things
# break without any change here) and on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ansible:
        description: "Also run the first-boot ansible-pull (default branch)"
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: >-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        run: |
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          rule+=', OPTIONS+="static_node=kvm"'
          echo "$rule" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf \
            mtools dosfstools openssh-client

      - name: Build the ISO
        run: autoinstall/build-usb.sh

      - name: Install and check in a VM
        env:
          ANSIBLE_FLAG: ${{ inputs.ansible && '--ansible' || '' }}
        run: |
          # shellcheck disable=SC2086  # empty or one flag
          autoinstall/test-vm.sh all --timeout 75 $ANSIBLE_FLAG

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: ~/.cache/llangvilla/vm/logs/
          if-no-files-found: ignore
