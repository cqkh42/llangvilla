name: Dependabot follow-up

# After Lint finishes on a Dependabot branch:
#   - GitHub Actions and linter bumps (dependabot/github_actions/…, dependabot/pip/…)
#     are squash-merged if lint passed;
#   - Nix bumps (dependabot/nix/…) get the VM test started on their branch, and wait
#     for a person to merge: they change what the machine runs.
# Runs in the base repository's context (workflow_run), so it never checks out or runs
# the PR's code; it only calls the GitHub API.
on:
  workflow_run:
    workflows: [Lint]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  follow-up:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge, or start the VM test
        run: |
          set -euo pipefail
          # The open PR for this branch, by Dependabot, still at the commit lint passed.
          pr=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" \
                 --jq '.[] | select(.user.login == "dependabot[bot]") | .number' | head -n1)
          if [[ -z $pr ]]; then echo "No open Dependabot PR for $BRANCH."; exit 0; fi
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [[ $head != "$SHA" ]]; then echo "PR #$pr moved on since lint ran; its new run decides."; exit 0; fi

          case $BRANCH in
            dependabot/github_actions/*|dependabot/pip/*)
              gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$SHA" \
                --jq '"Merged #'"$pr"': \(.message)"' ;;
            dependabot/nix/*)
              gh api -X POST "repos/$REPO/actions/workflows/vm-test.yml/dispatches" -f ref="$BRANCH"
              body="Lint passed. The VM test has been started on this branch"
              body+=" (Actions tab, **VM install test**); merge once it's green."
              body+=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
              gh api "repos/$REPO/issues/$pr/comments" -f body="$body" --jq .html_url ;;
            *) echo "Not an ecosystem this workflow handles: $BRANCH" ;;
          esac
