---
# Installs Colloid dark into /usr/share: Plasma style, window decorations (Mac-style
# buttons), colour scheme, icons, cursors and the GTK theme. Not the look-and-feel
# package: its defaults switch widgets to Kvantum, which is not used. Selecting
# them is the user layer's job (home-manager); the login screen is login_screen's.
- name: Install what the theme installers need
  community.general.pacman:
    name: [git, sassc]
    state: present

- name: Create the source and stamp directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ theme_src_dir }}"
    - "{{ theme_stamp_dir }}"

- name: Check out each Colloid theme at its pinned commit
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ theme_src_dir }}/{{ item.name }}"
    version: "{{ item.version }}"
    refspec: "{{ item.version }}"   # with depth, lets git fetch a bare commit
    depth: 1
    force: true
  loop:
    - {name: colloid-kde, repo: "{{ theme_colloid_kde_repo }}", version: "{{ theme_colloid_kde_version }}"}
    - {name: colloid-icons, repo: "{{ theme_colloid_icons_repo }}", version: "{{ theme_colloid_icons_version }}"}
    - {name: colloid-gtk, repo: "{{ theme_colloid_gtk_repo }}", version: "{{ theme_colloid_gtk_version }}"}
  loop_control:
    label: "{{ item.name }} {{ item.version[:12] }}"

# Plasma parts and cursors are copied directly (the upstream installer also writes
# root's ~/.Xresources and installs every variant). Dark variant only. A copy never
# deletes, so when a pinned commit changes, the old files go first: anything upstream
# dropped doesn't linger. A stamp per commit says which one is installed.
- name: Look up which Colloid commits are installed
  ansible.builtin.stat:
    path: "{{ theme_stamp_dir }}/{{ item }}"
  loop:
    - colloid-kde-{{ theme_colloid_kde_version }}
    - colloid-cursors-{{ theme_colloid_icons_version }}
  register: theme_stamps

- name: Remove the previous Colloid Plasma parts (the pinned commit changed)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/aurorae/themes/Colloid-dark
    - /usr/share/color-schemes/ColloidDark.colors
    - /usr/share/plasma/desktoptheme/Colloid-dark
  when: not theme_stamps.results[0].stat.exists

- name: Remove the previous Colloid cursors (the pinned commit changed)
  ansible.builtin.file:
    path: "/usr/share/icons/{{ item }}"
    state: absent
  loop: [Colloid-cursors, Colloid-dark-cursors]
  when: not theme_stamps.results[1].stat.exists

- name: Create the Plasma theme directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/share/aurorae/themes/Colloid-dark
    - /usr/share/color-schemes
    - /usr/share/plasma/desktoptheme/Colloid-dark

- name: Install the Colloid Plasma parts
  ansible.builtin.copy:
    src: "{{ theme_src_dir }}/colloid-kde/{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: u=rwX,go=rX
  loop:
    - {src: aurorae/Colloid-dark/, dest: /usr/share/aurorae/themes/Colloid-dark/}
    - {src: aurorae/common/, dest: /usr/share/aurorae/themes/Colloid-dark/}
    - {src: color-schemes/ColloidDark.colors, dest: /usr/share/color-schemes/ColloidDark.colors}
    - {src: plasma/desktoptheme/Colloid-dark/, dest: /usr/share/plasma/desktoptheme/Colloid-dark/}
    - {src: plasma/desktoptheme/icons, dest: /usr/share/plasma/desktoptheme/Colloid-dark/}
  loop_control:
    label: "{{ item.dest }}"

- name: Install the Colloid cursors (light and dark)
  ansible.builtin.copy:
    src: "{{ theme_src_dir }}/colloid-icons/cursors/{{ item.src }}/"
    dest: "/usr/share/icons/{{ item.dest }}/"
    remote_src: true
    owner: root
    group: root
    mode: u=rwX,go=rX
  loop:
    - {src: dist, dest: Colloid-cursors}
    - {src: dist-dark, dest: Colloid-dark-cursors}
  loop_control:
    label: "{{ item.dest }}"

- name: Record the installed Colloid Plasma and cursor commits
  ansible.builtin.copy:
    dest: "{{ theme_stamp_dir }}/{{ item.item }}"
    content: ""
    owner: root
    group: root
    mode: "0644"
  loop: "{{ theme_stamps.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

# Icons and GTK are generated by their installers, so they run once per pinned
# commit: the stamp's name carries the commit. Each installer deletes its own theme
# directory before installing (icons: install.sh's install(), `rm -rf "${THEME_DIR}"`;
# GTK: the same, with its -hdpi/-xhdpi variants), so nothing old lingers there.
- name: Install the Colloid icons (Colloid, Colloid-Light, Colloid-Dark)
  ansible.builtin.shell:
    cmd: ./install.sh --dest /usr/share/icons && touch "{{ theme_stamp_dir }}/colloid-icons-{{ theme_colloid_icons_version }}"
    chdir: "{{ theme_src_dir }}/colloid-icons"
    creates: "{{ theme_stamp_dir }}/colloid-icons-{{ theme_colloid_icons_version }}"

- name: Install the Colloid GTK theme (dark)
  ansible.builtin.shell:
    cmd: ./install.sh --dest /usr/share/themes --color dark && touch "{{ theme_stamp_dir }}/colloid-gtk-{{ theme_colloid_gtk_version }}"
    chdir: "{{ theme_src_dir }}/colloid-gtk"
    creates: "{{ theme_stamp_dir }}/colloid-gtk-{{ theme_colloid_gtk_version }}"

# Retired: earlier versions installed Colloid's look-and-feel package. Keep this until
# the machine has applied it once, then delete it (config/README.md, Removing things).
- name: Remove the Colloid look-and-feel package (no longer installed)
  ansible.builtin.file:
    path: /usr/share/plasma/look-and-feel/com.github.vinceliuice.Colloid-dark
    state: absent
