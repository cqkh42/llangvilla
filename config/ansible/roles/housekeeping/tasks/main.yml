---
# Keeps a long-lived Arch box tidy and watched: the package cache, the Nix store, a
# monthly btrfs scrub, and checks that leave a notice in the login message (shown at
# desktop login too, config/home/modules/notices.nix): firmware updates, disk health,
# an overdue apply. Timers only; nothing here runs during the apply, so it is safe at
# first boot. fstrim and systemd-boot updates are enabled by the installer.
- name: Install the cache cleaner, the firmware updater and the SMART tools
  community.general.pacman:
    name: [pacman-contrib, fwupd, smartmontools]
    state: present

# ---- the package cache: paccache's own timer keeps the last 3 versions of each
- name: Clean the package cache weekly (last 3 versions kept)
  ansible.builtin.systemd_service:
    name: paccache.timer
    enabled: true
    state: started

# ---- btrfs: btrfs-progs' own monthly scrub of /, which reads every block and checks
# its checksum. The disk check reports what it finds.
- name: Scrub the root filesystem monthly
  ansible.builtin.systemd_service:
    name: btrfs-scrub@-.timer   # "-" is / (systemd-escape -p /)
    enabled: true
    state: started
  when: (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='fstype') | first) == 'btrfs'

# ---- the Nix store and the user's home-manager generations
- name: Install the Nix cleanup service
  ansible.builtin.template:
    src: llangvilla-nix-cleanup.service.j2
    dest: /etc/systemd/system/llangvilla-nix-cleanup.service
    owner: root
    group: root
    mode: "0644"

# ---- the checks: a script each, run by a oneshot service on a timer
- name: Create the directory for llangvilla's scripts
  ansible.builtin.file:
    path: /usr/local/lib/llangvilla
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the check scripts
  ansible.builtin.copy:
    src: "llangvilla-{{ item.name }}.sh"
    dest: "/usr/local/lib/llangvilla/{{ item.name }}.sh"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ housekeeping_checks }}"
  loop_control:
    label: "{{ item.name }}.sh"

- name: Install the check services
  ansible.builtin.copy:
    dest: "/etc/systemd/system/llangvilla-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Written by config/ansible (housekeeping role). Edit the role, not this file.
      [Unit]
      Description={{ item.description }}
      {% if item.network | default(false) %}
      Wants=network-online.target
      After=network-online.target
      {% endif %}

      [Service]
      Type=oneshot
      ExecStart=/usr/local/lib/llangvilla/{{ item.name }}.sh{{ (' ' ~ item.args) if item.args is defined else '' }}
  loop: "{{ housekeeping_checks }}"
  loop_control:
    label: "llangvilla-{{ item.name }}.service"

- name: Install the timers
  ansible.builtin.copy:
    dest: "/etc/systemd/system/llangvilla-{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Written by config/ansible (housekeeping role). Edit the role, not this file.
      [Unit]
      Description={{ item.description }} ({{ item.calendar }})

      [Timer]
      OnCalendar={{ item.calendar }}
      Persistent=true
      RandomizedDelaySec=1h

      [Install]
      WantedBy=timers.target
  loop: "{{ housekeeping_timers }}"
  loop_control:
    label: "llangvilla-{{ item.name }}.timer"

- name: Turn on the timers
  ansible.builtin.systemd_service:
    name: "llangvilla-{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ housekeeping_timers }}"
  loop_control:
    label: "llangvilla-{{ item.name }}.timer"
