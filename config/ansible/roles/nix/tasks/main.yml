---
# Nix for the user layer (config/home), from Arch's own package: the daemon runs as
# root, and members of nix-users may use it. home_manager applies the flake.
- name: Install Nix
  community.general.pacman:
    name: nix
    state: present

- name: Turn on flakes and the nix command
  ansible.builtin.lineinfile:
    path: /etc/nix/nix.conf
    regexp: '^#?\s*experimental-features\s*='
    line: experimental-features = nix-command flakes
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart the Nix daemon

- name: Start the Nix daemon on demand (socket activation)
  ansible.builtin.systemd_service:
    name: nix-daemon.socket
    enabled: true
    state: started

# Arch's package doesn't create the store; the first Nix command as root does.
# Without this the user's first command fails: opening file "/nix/store".
- name: Initialise the Nix store
  ansible.builtin.command:
    cmd: nix --extra-experimental-features nix-command store info
    creates: /nix/store

# Arch's package leaves Nix's default `allowed-users = *`: every local user may use
# the daemon. Older packaging (and the Arch wiki) restricted it to nix-users; join
# that group only where it exists.
- name: Look for the nix-users group
  ansible.builtin.getent:
    database: group
    key: nix-users
    fail_key: false

- name: Let the login user use the Nix daemon (nix-users, where the group exists)
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: nix-users
    append: true
  when: ansible_facts.getent_group['nix-users'] is not none

# Restart the daemon now if nix.conf changed, not at the end of the play:
# home_manager, later in this play, needs the new settings.
- name: Apply a changed Nix daemon configuration before the user layer
  ansible.builtin.meta: flush_handlers
