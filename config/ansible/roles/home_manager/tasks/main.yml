---
# Applies the user layer as the login user. The home-manager CLI comes from the
# flake's pinned input. `-b backup` moves aside files it would otherwise refuse to
# overwrite (e.g. the stock ~/.bashrc becomes ~/.bashrc.backup), and
# HOME_MANAGER_BACKUP_OVERWRITE replaces an older backup instead of failing the
# switch on a second clash: edit dotfiles in the repo, not on the machine (#18).
# The first run fetches nixpkgs and downloads from cache.nixos.org: minutes, not
# seconds. Changed only when the switch produced a new generation.
# A dry run (apply.sh -- --check) skips the switch below, so build the configuration
# instead: that catches a broken user layer without changing anything in $HOME.
- name: Build the user layer without switching (dry runs only)
  ansible.builtin.command:
    cmd: nix build "path:{{ home_manager_flake_dir }}#homeConfigurations.{{ user_name }}.activationPackage" --no-link
  environment:
    NIX_REMOTE: daemon
  become: true
  become_user: "{{ user_name }}"
  check_mode: false
  changed_when: false
  when: ansible_check_mode

- name: Apply the user layer (home-manager switch)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      profile="$HOME/.local/state/nix/profiles/home-manager"
      mkdir -p "${profile%/*}"   # home-manager needs the profiles directory to exist
      before=$(readlink -f "$profile" || true)
      nix run "path:$FLAKE#home-manager" -- switch -b backup --flake "path:$FLAKE#$HM_USER"
      after=$(readlink -f "$profile" || true)
      if [ "$before" = "$after" ]; then echo "hm-generation: unchanged"; else echo "hm-generation: new"; fi
    executable: /bin/bash
  environment:
    FLAKE: "{{ home_manager_flake_dir }}"
    HM_USER: "{{ user_name }}"
    NIX_REMOTE: daemon   # the store belongs to root; go through the daemon
    HOME_MANAGER_BACKUP_OVERWRITE: "1"
  become: true
  become_user: "{{ user_name }}"
  register: home_manager_switch
  changed_when: "'hm-generation: new' in home_manager_switch.stdout"
