---
# Personalises the machine. Run it with config/apply.sh (config/README.md), never
# directly with ansible-pull: apply.sh is the one entrypoint, at first boot and later.
# Each role has a tag of its own name, so `apply.sh -- --tags user_avatar` runs one role.
- name: Personalise the OptiPlex
  hosts: optiplex
  vars:
    # The look (theme names, fonts, wallpaper), shared with the user layer. It lives
    # in config/home because the Nix flake can only read files inside its directory.
    look: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../home/theme.json') | from_json }}"
  pre_tasks:
    - name: Check the login user exists (created by the installer)
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_name }}"
      tags: [always]
  roles:
    - role: packages
      tags: [packages]
    - role: boot
      tags: [boot]
    - role: firewall
      tags: [firewall]
    - role: theme
      tags: [theme]
    - role: login_screen
      tags: [login_screen]
    - role: user_avatar
      tags: [user_avatar]
    - role: nix
      tags: [nix]
    - role: home_manager   # last: the user layer builds on everything above
      tags: [home_manager]
