- name: Install SDDM and dependencies
  community.general.pacman:
    name: [sddm, kwin, qt6-wayland, qt6-svg, qt6-declarative, unzip]
    state: present

- name: Download theme zip (verified, skipped if unchanged)
  ansible.builtin.get_url:
    url: "{{ sddm_theme_url }}"
    dest: "{{ sddm_theme_zip }}"
    checksum: "sha256:{{ sddm_theme_sha256 }}"
    mode: "0644"
  notify: Unpack SDDM theme

- name: Create SDDM config drop-in directory
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    mode: "0755"

- name: Set the SDDM theme
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/10-theme.conf
    mode: "0644"
    content: |
      [Theme]
      Current={{ sddm_theme_name }}

      [General]
      UserIcon="true"
      
- name: Configure SDDM greeter (Wayland, remember last user/session)
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/10-wayland.conf
    mode: "0644"
    content: |
      [General]
      DisplayServer=wayland

      [Users]
      RememberLastUser=true
      RememberLastSession=true

- name: Configure Catpuccin Theme
  ansible.builtin.copy:
    dest: /usr/share/sddm/themes/catppuccin-mocha-mauve/theme.conf
    mode: "0644"
    content: |
      [General]
      ClockEnabled="false"

- name: Enable SDDM at boot
  ansible.builtin.systemd:
    name: sddm
    enabled: true
