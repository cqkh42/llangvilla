---
# Catppuccin SDDM theme for Arch Linux.
# Pinned by version + sha256. Bump both together to update.
# Get the hash with: curl -sL <zip url> | sha256sum
- name: Catppuccin SDDM
  become: true

  vars:
    sddm_flavor: mocha
    sddm_accent: mauve
    sddm_catppuccin_version: "v1.1.2"        # check github.com/catppuccin/sddm/releases
    sddm_theme_sha256: "PASTE_SHA256_HERE"
    sddm_theme_name: "catppuccin-{{ sddm_flavor }}-{{ sddm_accent }}"
    sddm_theme_url: "https://github.com/catppuccin/sddm/releases/download/{{ sddm_catppuccin_version }}/{{ sddm_theme_name }}-sddm.zip"
    sddm_theme_zip: "/var/tmp/{{ sddm_theme_name }}-{{ sddm_catppuccin_version }}.zip"

  block:
    - name: Install SDDM and dependencies
      community.general.pacman:
        name: [sddm, qt6-svg, qt6-declarative, unzip]
        state: present

    - name: Download theme zip (verified, skipped if unchanged)
      ansible.builtin.get_url:
        url: "{{ sddm_theme_url }}"
        dest: "{{ sddm_theme_zip }}"
        checksum: "sha256:{{ sddm_theme_sha256 }}"
        mode: "0644"
      notify: Unpack SDDM theme

    - name: Create SDDM config drop-in directory
      ansible.builtin.file:
        path: /etc/sddm.conf.d
        state: directory
        mode: "0755"

    - name: Set the SDDM theme
      ansible.builtin.copy:
        dest: /etc/sddm.conf.d/10-theme.conf
        mode: "0644"
        content: |
          [Theme]
          Current={{ sddm_theme_name }}

    - name: Enable SDDM at boot
      ansible.builtin.systemd:
        name: sddm
        enabled: true

  handlers:
    - name: Unpack SDDM theme
      ansible.builtin.unarchive:
        src: "{{ sddm_theme_zip }}"
        dest: /usr/share/sddm/themes/
        remote_src: true
