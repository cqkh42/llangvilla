- hosts: 
  - optiplex
  tasks: 
    - name: Remove plasma welcome
      community.general.pacman:
        name: plasma-welcome 
        state: absent
        purge: true
    - name: Prevent Plasma Welcome Reinstall
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        regexp: '^#?IgnorePkg'
        line: 'IgnorePkg = plasma-welcome'
