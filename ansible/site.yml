- hosts: 
  - optiplex
  tasks: 
    - name: Set basic env vars
      debug:
        msg: hello
    - name: Install packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - qemu-system-x86
        state: present
        update_cache: yes
    - name: Add jack to the kvm group
      ansible.builtin.user:
        name: jack
        groups: kvm
        append: true
      become: true
